name: CI - Pacientes

on:
  push:
    branches: ["**"]
    paths:
      - "Pacientes/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Pacientes/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  build-test:
    name: Compilar y probar Pacientes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Pacientes

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Pacientes/pom.xml

      - name: Compilar y ejecutar pruebas unitarias
        run: mvn -B -ntp clean verify

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas-pacientes
          path: Pacientes/target/surefire-reports
