spring:
  application:
    name: Gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: pacientes
              uri: lb://Pacientes
              predicates:
                - Path=/api/pacientes/**
            - id: citas
              uri: lb://Citas
              predicates:
                - Path=/api/citas/**
            - id: atenciones
              uri: lb://Atenciones
              predicates:
                - Path=/api/atenciones/**
            - id: notificaciones
              uri: lb://Notificaciones
              predicates:
                - Path=/api/notificaciones/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true